<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Worlog privacy and support information.">
  <title>Worlog</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #14373f;
      --muted: #59747a;
      --line: #d6e7e8;
      --surface: #ffffff;
      --page: #f5fbfa;
      --accent: #08a2c5;
      --accent-strong: #087d98;
      --coral: #e86f68;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--page);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 16px;
      line-height: 1.7;
      letter-spacing: 0;
    }

    header {
      border-bottom: 1px solid var(--line);
      background: var(--surface);
    }

    .header-inner,
    main,
    footer {
      width: min(760px, calc(100% - 40px));
      margin: 0 auto;
    }

    .header-inner {
      display: flex;
      align-items: center;
      min-height: 72px;
    }

    .brand {
      font-size: 22px;
      font-weight: 850;
    }

    main {
      min-height: calc(100vh - 145px);
      padding: 72px 0;
    }

    h1 {
      margin: 0;
      font-size: clamp(42px, 10vw, 68px);
      line-height: 1.05;
      font-weight: 900;
    }

    .intro {
      max-width: 580px;
      margin: 18px 0 42px;
      color: var(--muted);
      font-size: 18px;
    }

    nav {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    nav a {
      min-height: 112px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 22px;
      background: var(--surface);
      color: var(--ink);
      text-decoration: none;
    }

    nav a:first-child {
      border-top: 5px solid var(--accent);
    }

    nav a:last-child {
      border-top: 5px solid var(--coral);
    }

    nav strong {
      display: block;
      margin-bottom: 5px;
      font-size: 19px;
    }

    nav span {
      color: var(--muted);
      font-size: 14px;
    }

    footer {
      border-top: 1px solid var(--line);
      padding: 24px 0 32px;
      color: var(--muted);
      font-size: 13px;
    }

    @media (max-width: 540px) {
      main {
        padding-top: 52px;
      }

      nav {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="brand">Worlog</div>
    </div>
  </header>

  <main>
    <h1>Worlog</h1>
    <p class="intro">
      Worlogのプライバシーとサポートに関する情報をご案内します。
      Privacy and support information for Worlog.
    </p>

    <nav aria-label="Worlog information">
      <a href="./privacy/">
        <strong>プライバシーポリシー</strong>
        <span>Privacy Policy</span>
      </a>
      <a href="./support/">
        <strong>サポート</strong>
        <span>Support</span>
      </a>
    </nav>
  </main>

  <footer>Worlog</footer>
</body>
</html>
